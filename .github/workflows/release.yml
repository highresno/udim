name: Bygg Windows-installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Skriv versjon og commit
        shell: bash
        run: |
          printf 'VERSION = "%s"\nCOMMIT = "%s"\n' "$APP_VERSION" "$GITHUB_SHA" > app/build_info.py
          cat app/build_info.py

      - name: Selvtest (Python)
        run: python app/main.py --selftest

      - name: Bygg app med PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name "UDIM Tiler"
          --icon build/icon.ico
          --add-data "app/ui;ui"
          --paths app
          --collect-all OpenImageIO
          --collect-all webview
          --distpath dist --workpath build/work
          app/main.py

      - name: Selvtest (ferdig exe)
        shell: pwsh
        run: |
          $env:UDIM_SELFTEST_LOG = "$PWD\selftest.log"
          $p = Start-Process -FilePath "dist\UDIM Tiler\UDIM Tiler.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { throw "Selvtest feilet med kode $($p.ExitCode)" }

      - name: Lag installer med Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc /DAppVersion=$env:APP_VERSION build\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: UDIM-Tiler-Setup
          path: build/out/UDIM-Tiler-Setup.exe

      - name: Publiser release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v$APP_VERSION" build/out/UDIM-Tiler-Setup.exe \
            --title "UDIM Tiler $APP_VERSION" \
            --notes "commit: $GITHUB_SHA" \
            --target "$GITHUB_SHA" --latest
